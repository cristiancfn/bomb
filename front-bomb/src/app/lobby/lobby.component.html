<div class="lobby-container">
    <div class="lobby-card">
        <h1>SQUAD ANTIBOMBAS</h1>
        <p>Ingresa un ID de sala y tu nombre para comenzar la desactivación.</p>

        <div class="input-group">
            <input type="text" [(ngModel)]="nombreJugador" placeholder="Ingresa tu Nombre de Operario"
                class="lobby-input" />
            <input type="text" [(ngModel)]="roomId" placeholder="Ingresa el ID de la Sala" class="lobby-input" />
        </div>

        <div class="action-buttons">
            <button class="btn-connect" (click)="conectar()" [disabled]="!roomId() || isConnected()">
                {{ isConnected() ? 'CONECTADO' : 'CONECTAR A SALA' }}
            </button>
            <button class="btn-start" (click)="iniciar()" [disabled]="!isConnected()">
                INICIAR PARTIDA
            </button>
        </div>
    </div>
</div>
