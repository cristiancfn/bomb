<div class="simon-module" [class.resolved]="isResolved()">

    <div class="module-header">
        <button type="button" class="play-btn" [disabled]="isFlashing() || isResolved()" (click)="mostrarSecuencia()">
            MOSTRAR
        </button>
        <div class="progress-indicator">
            Fase: {{ indiceUsuario() }} / 4
        </div>
    </div>

    <div class="simon-grid">
        @for (color of coloresBase; track color) {
        <button type="button" class="simon-btn color-{{ color.toLowerCase() }}" [class.active]="colorActivo() === color"
            [disabled]="isFlashing() || isResolved()" (click)="presionarColor(color)">
        </button>
        }
    </div>

</div>
